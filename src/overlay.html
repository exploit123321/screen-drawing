<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'">
<title>ScreenDrawing overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="shade"></canvas>
<canvas id="ink"></canvas>

<div id="modebar" hidden>
  <span class="hint">Drag to select</span>
  <button data-mode="region" class="on">Rectangle</button>
  <button data-mode="free">Freehand</button>
  <button data-mode="full">Full screen</button>
  <span class="hint dim">Tab switches · Esc cancels</span>
</div>
<div id="dims" hidden></div>

<div id="toolbar" hidden>
  <div class="row">
    <div id="grip" data-tip="Drag to move"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg></div>
    <!-- number keys 1, 2, 3... pick the tools in this order -->
    <button data-tool="pen" data-tip="Pen (1)"><svg viewBox="0 0 24 24"><path d="M3 21l4-1 12-12-3-3L4 17z"/><path d="M14 6l3 3"/></svg></button>
    <button data-tool="eraser" data-tip="Eraser (2)"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-9 9H7l-4-4z"/><path d="M8 10l6 6M12 21h9"/></svg></button>
    <button data-tool="arrow" data-tip="Arrow (3)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button data-tool="line" data-tip="Line (4)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button data-tool="rect" data-tip="Rectangle (5)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg></button>
    <button data-tool="ellipse" data-tip="Ellipse (6)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg></button>
    <button data-tool="highlighter" data-tip="Highlighter (7)"><svg viewBox="0 0 24 24"><path d="M15 4l5 5-8 8-5-5z"/><path d="M7 12l-2 4 3 3 4-2M4 21h6"/></svg></button>
    <button data-tool="text" data-tip="Text (8)"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg></button>
    <span class="sep"></span>
    <button id="undo" data-tip="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button id="redo" data-tip="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button id="clear" data-tip="Clear all"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  </div>
  <div class="row">
    <div id="swatch" data-tip="Left button draws primary, right button secondary · click to swap"><i class="c2"></i><i class="c1"></i></div>
    <div id="colors" data-tip="Click: primary · right-click: secondary"></div>
    <label class="custom" data-tip="Custom color (right-click: secondary)"><input type="color" id="custom" value="#ff3b30"></label>
    <span class="sep"></span>
    <input type="range" id="width" min="1" max="24" value="4" data-tip="Thickness (Shift+wheel)">
    <span id="wpreview"><i></i></span>
    <span class="grow"></span>

    <span class="only-draw">
      <button id="through" data-tip="Click-through: use windows underneath (Esc exits)"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
      <button id="cap-region" data-tip="Capture rectangle"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/></svg></button>
      <button id="cap-free" data-tip="Capture freehand"><svg viewBox="0 0 24 24"><path d="M12 5c5 0 8 1.8 8 4.5S17 14 12 14s-8-1.8-8-4.5S7 5 12 5z" stroke-dasharray="3 2.4"/><path d="M9 15c-1 3 0 5 2 5"/></svg></button>
      <button id="cap-full" data-tip="Capture full screen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
    </span>
    <span class="only-capture">
      <button id="copy" class="primary" data-tip="Copy to clipboard (Ctrl+C)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 011-1h10"/></svg><b>Copy</b></button>
      <button id="save" class="primary" data-tip="Save as PNG / JPEG (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><b>Save</b></button>
    </span>
    <button id="close" data-tip="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<div id="toast" hidden></div>
<div id="sizering" hidden></div>
<script src="overlay.js"></script>
</body>
</html>
